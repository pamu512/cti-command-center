# Cheap shared_utils pytest suite on push/PR to main.
# Parked: cargo test / Tauri (GTK/WebKit on Linux), vendored crawler tests.

name: Python unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shared_utils test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r src-tauri/resources/scripts/shared_utils/requirements.txt \
            -r src-tauri/resources/scripts/shared_utils/requirements-dev.txt

      - name: Run shared_utils unit tests
        run: python -m pytest src-tauri/resources/scripts/shared_utils/tests
